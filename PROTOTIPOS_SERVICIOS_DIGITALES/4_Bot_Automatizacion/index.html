<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Inteligente - Asistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            🤖 Asistente Virtual Inteligente
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="mensaje bot">
                <p>¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte?</p>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu pregunta..." autocomplete="off">
            <button id="send-btn">📤</button>
        </div>

        <div class="opciones-rapidas">
            <button class="opcion" onclick="enviarMensaje('Horarios de atención')">⏰ Horarios</button>
            <button class="opcion" onclick="enviarMensaje('Precios')">💰 Precios</button>
            <button class="opcion" onclick="enviarMensaje('Contacto')">📞 Contacto</button>
            <button class="opcion" onclick="enviarMensaje('Ubicación')">📍 Ubicación</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
